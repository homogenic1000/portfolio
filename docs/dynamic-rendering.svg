<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1180" font-family="Menlo, Consolas, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f97316"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="1560" height="1180" fill="#0f172a"/>
  <text x="30" y="46" fill="#f8fafc" font-size="24" font-weight="bold">Dynamic Project Rendering — how the JS logic flows</text>

  <!-- PHASE 1 -->
  <text x="30" y="90" fill="#38bdf8" font-size="15">PHASE 1 · BOOT (once)</text>
  <rect x="30" y="102" width="330" height="120" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="45" y="128" fill="#7dd3fc" font-size="13">index.html loads scripts:</text>
  <text x="45" y="148" fill="#cbd5e1" font-size="12">handlers · boundaries · objects</text>
  <text x="45" y="166" fill="#cbd5e1" font-size="12">projects · physics · animation · cdnLOAD</text>
  <text x="45" y="190" fill="#64748b" font-size="11">classic scripts share global scope</text>
  <line x1="360" y1="162" x2="420" y2="162" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="425" y="112" width="290" height="100" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="440" y="138" fill="#7dd3fc" font-size="13">animation.js</text>
  <text x="440" y="158" fill="#cbd5e1" font-size="12">user clicks bag → 15 frames</text>
  <text x="440" y="176" fill="#cbd5e1" font-size="12">→ startPhysics()</text>
  <text x="440" y="198" fill="#64748b" font-size="11">Matter.js loaded async by cdnLOAD</text>
  <line x1="715" y1="162" x2="775" y2="162" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="780" y="102" width="750" height="120" rx="10" fill="#1e293b" stroke="#22c55e"/>
  <text x="795" y="128" fill="#86efac" font-size="13">physics.js — Matter world born</text>
  <text x="795" y="148" fill="#cbd5e1" font-size="12">initRender(): canvas fixed · 100vw×100vh · z-index 3 · pointer-events:auto</text>
  <text x="795" y="168" fill="#cbd5e1" font-size="12">window.matterCanvas saved · boundaries added · bodies spawn ×500ms</text>
  <text x="795" y="188" fill="#fbbf24" font-size="12">⚠ this invisible full-screen canvas intercepts ALL clicks/text-selection</text>
  <text x="795" y="210" fill="#64748b" font-size="11">labels: tabac · filtre · pamplemousse · rondpoint · aboutme · korg</text>

  <!-- PHASE 2 -->
  <text x="30" y="262" fill="#38bdf8" font-size="15">PHASE 2 · CLICK A FALLING OBJECT</text>
  <rect x="30" y="274" width="240" height="70" rx="10" fill="#1e293b" stroke="#94a3b8"/>
  <text x="45" y="300" fill="#e2e8f0" font-size="13">👤 user clicks korg sprite</text>
  <text x="45" y="322" fill="#64748b" font-size="11">(click lands on matter canvas)</text>
  <line x1="270" y1="309" x2="330" y2="309" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="335" y="274" width="380" height="70" rx="10" fill="#1e293b" stroke="#22c55e"/>
  <text x="350" y="300" fill="#86efac" font-size="13">physics.js · setupClickHandlers()</text>
  <text x="350" y="320" fill="#cbd5e1" font-size="12">hit-test Bounds.contains + Vertices.contains</text>
  <line x1="715" y1="309" x2="775" y2="309" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="780" y="274" width="430" height="70" rx="10" fill="#1e293b" stroke="#22c55e"/>
  <text x="795" y="300" fill="#86efac" font-size="13">handleObjectClick( body.label )</text>
  <text x="795" y="320" fill="#cbd5e1" font-size="12">generic: if (PROJECTS[label]) enterProject(label)</text>
  <line x1="1210" y1="309" x2="1270" y2="309" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrO)"/>

  <!-- ENTER -->
  <rect x="1275" y="264" width="255" height="86" rx="12" fill="#7c2d12" stroke="#f97316" stroke-width="2"/>
  <text x="1290" y="292" fill="#fdba74" font-size="14" font-weight="bold">enterProject(id)</text>
  <text x="1290" y="312" fill="#fed7aa" font-size="11">projects-controller.js</text>
  <text x="1290" y="332" fill="#fed7aa" font-size="11">cfg = PROJECTS[id]</text>

  <!-- Fan out -->
  <text x="30" y="392" fill="#f97316" font-size="15">PHASE 3 · enterProject(id) FAN-OUT — one function, four jobs, data comes from PROJECTS[id]</text>
  <line x1="1400" y1="350" x2="1400" y2="405" stroke="#f97316" stroke-width="2.5"/>
  <line x1="1400" y1="405" x2="200" y2="405" stroke="#f97316" stroke-width="2.5"/>
  <line x1="1400" y1="405" x2="760" y2="405" stroke="#f97316" stroke-width="2.5" opacity="0.35"/>
  <line x1="200" y1="405" x2="200" y2="432" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrO)"/>
  <line x1="585" y1="405" x2="585" y2="432" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrO)"/>
  <line x1="975" y1="405" x2="975" y2="432" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrO)"/>
  <line x1="1360" y1="405" x2="1360" y2="432" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrO)"/>

  <rect x="40" y="437" width="330" height="150" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="55" y="462" fill="#7dd3fc" font-size="13">① UI STATE</text>
  <text x="55" y="484" fill="#cbd5e1" font-size="12">hide #hero-section · #title-d</text>
  <text x="55" y="502" fill="#cbd5e1" font-size="12">hide #sandwich · #animation-bag</text>
  <text x="55" y="520" fill="#cbd5e1" font-size="12">#layout → display:flex</text>
  <text x="55" y="542" fill="#cbd5e1" font-size="12">body.bg ← cfg.bg (per project color)</text>
  <text x="55" y="572" fill="#64748b" font-size="11">was hardcoded in old korg.js</text>

  <rect x="400" y="437" width="370" height="150" rx="10" fill="#1e293b" stroke="#22c55e"/>
  <text x="415" y="462" fill="#86efac" font-size="13">② PHYSICS SLEEP</text>
  <text x="415" y="484" fill="#cbd5e1" font-size="12">pausePhysics() [new helper]</text>
  <text x="415" y="504" fill="#cbd5e1" font-size="12">Matter.Render.stop(render)</text>
  <text x="415" y="522" fill="#cbd5e1" font-size="12">Matter.Runner.stop(runner)</text>
  <text x="415" y="544" fill="#cbd5e1" font-size="12">matterCanvas.display = "none"</text>
  <text x="415" y="572" fill="#fbbf24" font-size="11">✓ text selection works again ✓ CPU freed</text>

  <rect x="800" y="437" width="350" height="150" rx="10" fill="#1e293b" stroke="#eab308"/>
  <text x="815" y="462" fill="#fde047" font-size="13">③ CONTENT INJECTION</text>
  <text x="815" y="484" fill="#cbd5e1" font-size="12">#project-title ← cfg.title</text>
  <text x="815" y="502" fill="#cbd5e1" font-size="12">#project-text ← cfg.text</text>
  <text x="815" y="522" fill="#cbd5e1" font-size="12">breadcrumb: index / {cfg.title}</text>
  <text x="815" y="550" fill="#64748b" font-size="11">one empty layout filled per project</text>

  <rect x="1180" y="437" width="350" height="150" rx="10" fill="#1e293b" stroke="#a78bfa"/>
  <text x="1195" y="462" fill="#c4b5fd" font-size="13">④ MEDIA ROUTER — cfg.media.type</text>
  <text x="1195" y="488" fill="#cbd5e1" font-size="12">"3d"    → CDViewer.show(modelPath)</text>
  <text x="1195" y="506" fill="#cbd5e1" font-size="12">           lazy three.js init → #container-cd</text>
  <text x="1195" y="528" fill="#cbd5e1" font-size="12">"video" → #project-video.src ← src, play()</text>
  <text x="1195" y="550" fill="#cbd5e1" font-size="12">ALWAYS  → carousel(cfg.images) → #show-min</text>
  <text x="1195" y="576" fill="#a5b4fc" font-size="11">today: only korg is "3d"; others = video</text>

  <!-- CONFIG BOX -->
  <rect x="40" y="617" width="1490" height="118" rx="10" fill="#14261a" stroke="#eab308" stroke-dasharray="6 4"/>
  <text x="55" y="641" fill="#fde047" font-size="13">script/projects.js — THE RECIPE BOX (single source of truth · adding a project = adding one entry)</text>
  <text x="55" y="664" fill="#e2e8f0" font-size="12">const PROJECTS = {</text>
  <text x="75" y="682" fill="#e2e8f0" font-size="12">korg:         { title:"…Korg jewel case", text:"…Nelson Weber…", bg:"white",  media:{type:"3d", modelPath:"assets/model/cd.glb"}, images:[…] },</text>
  <text x="75" y="700" fill="#e2e8f0" font-size="12">pamplemousse: { title:"…",                text:"…",              bg:"orange", media:{type:"video", src:"assets/videos/p.mp4"},    images:[…] },</text>
  <text x="55" y="722" fill="#e2e8f0" font-size="12">}</text>

  <!-- EXIT -->
  <text x="30" y="782" fill="#ef4444" font-size="15">PHASE 4 · EXIT (back button #index — now wired to exitProject)</text>
  <rect x="40" y="794" width="250" height="66" rx="10" fill="#1e293b" stroke="#ef4444"/>
  <text x="55" y="820" fill="#fca5a5" font-size="13">👤 clicks "index"</text>
  <text x="55" y="842" fill="#cbd5e1" font-size="12">exitProject(currentId)</text>
  <line x1="290" y1="827" x2="350" y2="827" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrR)"/>
  <rect x="355" y="794" width="1175" height="66" rx="10" fill="#1e293b" stroke="#ef4444"/>
  <text x="370" y="818" fill="#fca5a5" font-size="12">④ media cleanup: video.pause() · CDViewer.hide() + loop stop · destroy carousel</text>
  <text x="370" y="840" fill="#fca5a5" font-size="12">② resumePhysics(): canvas display:block · Render.run · Runner.run   ① restore hero · hide #layout · reset bg</text>

  <!-- LEGEND -->
  <rect x="40" y="890" width="1490" height="120" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="55" y="916" fill="#94a3b8" font-size="13">LEGEND / KEY IDEAS</text>
  <circle cx="70" cy="940" r="6" fill="#22c55e"/><text x="85" y="945" fill="#cbd5e1" font-size="12">green = Matter.js physics layer</text>
  <circle cx="420" cy="940" r="6" fill="#a78bfa"/><text x="435" y="945" fill="#cbd5e1" font-size="12">purple = three.js media layer (lazy: only spins up when a "3d" project opens)</text>
  <circle cx="70" cy="964" r="6" fill="#eab308"/><text x="85" y="969" fill="#cbd5e1" font-size="12">yellow = pure data (PROJECTS config)</text>
  <circle cx="420" cy="964" r="6" fill="#f97316"/><text x="435" y="969" fill="#cbd5e1" font-size="12">orange = controller (the ONLY place that knows the enter/exit choreography)</text>
  <text x="85" y="995" fill="#64748b" font-size="12">Adding project N+1 = add entry to PROJECTS + add sprite in OBJECT_CONFIG. No new HTML sections, no new korg.js clones.</text>

  <!-- WHY OLD CODE FAILED -->
  <rect x="40" y="1024" width="1490" height="130" rx="10" fill="#1a1030" stroke="#ef4444" stroke-dasharray="6 4"/>
  <text x="55" y="1050" fill="#fca5a5" font-size="13">WHY THE OLD korg.js CANVAS-HIDE DID NOTHING</text>
  <text x="55" y="1074" fill="#e2e8f0" font-size="12">korg.js lines 24–25 targeted the right canvas (window.matterCanvas) — but if ANY line above threw (or browser ran a stale cache), execution never reached them.</text>
  <text x="55" y="1096" fill="#e2e8f0" font-size="12">New flow calls pausePhysics() FIRST-class as job ② — even if UI styling hiccups, physics sleep is independent, testable, and reversible.</text>
  <text x="55" y="1118" fill="#94a3b8" font-size="11">verify in DevTools Console: zero red errors on entering a project after the refactor</text>

  <text x="30" y="1166" fill="#475569" font-size="11">portfolio · dynamic-projects branch · docs/dynamic-rendering.svg</text>
</svg>
