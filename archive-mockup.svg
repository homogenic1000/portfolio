<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1512" height="880" viewBox="0 0 1512 880">
  <!--
    archive.html — SVG design mockup (1512px reference viewport)
    Reproduces the layout generated by css/archive.css + script/archive.js + script/loves.js.
    Edit this SVG in Figma / Illustrator to experiment with the design.

    Grid columns @1512px (from .archive grid-template-columns):
      col1 = clamp(70,6vw,100)px   -> left 10,      width 90.7
      col2 = clamp(220,23vw,360)px -> left 128.7,   width 347.8
      col3 = clamp(250,27vw,430)px -> left 504.5,   width 408.2
      col4 = remaining (fluid)     -> left 940.7
      column-gap 28px, page padding 10px

    Guide lines (greys) mark column boundaries — delete group #guides when done.
  -->

  <rect width="1512" height="880" fill="#ffffff"/>

  <!-- ===================== HEADER ROW ===================== -->
  <g id="header-row" font-family="IBM Plex Serif, serif" font-style="italic" font-weight="400" font-size="24.6" fill="#0008ff">
    <text x="10"     y="41">Index/</text>
    <text x="128.7"  y="41">name</text>
    <text x="504.5"  y="41">type</text>
    <text x="940.7"  y="41">date</text>
  </g>
  <!-- header bottom / 1px rule -->
  <line x1="10" y1="54" x2="1502" y2="54" stroke="lightgrey" stroke-width="1"/>

  <!-- ===================== PROJECT ROWS (script/archive.js) ===================== -->
  <!-- Row 1 — Frip'O'Point -->
  <g id="row-01" font-family="Overused Grotesk, sans-serif" font-weight="400" font-size="24.6" fill="#000000">
    <text x="10"     y="98.6">01</text>
    <text x="128.7"  y="98.6" fill="#1f7039">Frip'O'Point</text>
    <text x="504.5"  y="98.6">motion design</text>
    <text x="940.7"  y="98.6">2025</text>
  </g>
  <line x1="10" y1="126" x2="1502" y2="126" stroke="lightgrey" stroke-width="1"/>

  <!-- Row 2 — vroomVROOM -->
  <g id="row-02" font-family="Overused Grotesk, sans-serif" font-weight="400" font-size="24.6" fill="#000000">
    <text x="10"     y="170.6">02</text>
    <text x="128.7"  y="170.6" fill="#4a4a4a">vroomVROOM</text>
    <text x="504.5"  y="170.6">motion design</text>
    <text x="940.7"  y="170.6">2026</text>
  </g>
  <line x1="10" y1="198" x2="1502" y2="198" stroke="lightgrey" stroke-width="1"/>

  <!-- Row 3 — Premier jour d'été -->
  <g id="row-03" font-family="Overused Grotesk, sans-serif" font-weight="400" font-size="24.6" fill="#000000">
    <text x="10"     y="242.6">03</text>
    <text x="128.7"  y="242.6" fill="#8a6200">Premier jour d'été</text>
    <text x="504.5"  y="242.6">photographie</text>
    <text x="940.7"  y="242.6">2025</text>
  </g>
  <line x1="10" y1="270" x2="1502" y2="270" stroke="lightgrey" stroke-width="1"/>

  <!-- Row 4 — the portfolio (disabled) -->
  <g id="row-04" font-family="Overused Grotesk, sans-serif" font-weight="400" font-size="24.6" fill="#c5c5c5">
    <text x="10"     y="314.6">04</text>
    <text x="128.7"  y="314.6">the portfolio</text>
    <text x="504.5"  y="314.6">webdesign/dev</text>
    <text x="940.7"  y="314.6">2025 → 2026</text>
  </g>
  <line x1="10" y1="342" x2="1502" y2="342" stroke="lightgrey" stroke-width="1"/>

  <!-- Row 5 — Korg -->
  <g id="row-05" font-family="Overused Grotesk, sans-serif" font-weight="400" font-size="24.6" fill="#000000">
    <text x="10"     y="386.6">05</text>
    <text x="128.7"  y="386.6" fill="#7a5f33">Korg</text>
    <text x="504.5"  y="386.6">graphic design</text>
    <text x="940.7"  y="386.6">2024 → 2026</text>
  </g>
  <line x1="10" y1="414" x2="1502" y2="414" stroke="lightgrey" stroke-width="1"/>

  <!-- ===================== "things i love" (script/loves.js) ===================== -->
  <!-- canvas: from y=433.2, min-height 384px (40vh @880) -->
  <g id="loves-world">
    <!-- aboutme portrait — matheo.webp (2316x3088), scale 0.084 -->
    <image id="loves-aboutme" href="assets/2d/matheo.webp"
           x="204.7" y="504.6" width="195.4" height="260.5"/>
    <!-- homogenic album — homogenic.webp (1000x1000), scale 0.06 -->
    <image id="loves-homogenic" href="assets/2d/loves/homogenic.webp"
           x="574.8" y="588" width="60" height="60"/>
    <!-- todo placeholder 1 -->
    <rect id="loves-todo1" x="872.7" y="622.8" width="69.1" height="69.1" fill="#1a1a1a"/>
    <!-- todo placeholder 2 -->
    <rect id="loves-todo2" x="1171.2" y="590.8" width="76.8" height="76.8" fill="#6e6e6e"/>
  </g>
  <line x1="10" y1="433.2" x2="1502" y2="433.2" stroke="lightgrey" stroke-width="1"/>

  <!-- ===================== LINKS ROW ===================== -->
  <g id="about-links" font-family="IBM Plex Serif, serif" font-style="italic" font-weight="400" font-size="22.7" fill="#000000">
    <text x="10"     y="845.2">repo</text>
    <text x="128.7"  y="845.2">instagram</text>
    <text x="504.5"  y="845.2">github</text>
    <text x="940.7"  y="845.2">soundcloud</text>
  </g>
  <line x1="10" y1="817.2" x2="1502" y2="817.2" stroke="lightgrey" stroke-width="1"/>

  <!-- ===================== GUIDES (delete when done) ===================== -->
  <g id="guides" stroke="#e8e8f0" stroke-width="1" stroke-dasharray="4 5" stroke-opacity="0.6">
    <line x1="10"    y1="0" x2="10"    y2="880"/>
    <line x1="100.7" y1="0" x2="100.7" y2="880"/>
    <line x1="128.7" y1="0" x2="128.7" y2="880"/>
    <line x1="476.5" y1="0" x2="476.5" y2="880"/>
    <line x1="504.5" y1="0" x2="504.5" y2="880"/>
    <line x1="912.7" y1="0" x2="912.7" y2="880"/>
    <line x1="940.7" y1="0" x2="940.7" y2="880"/>
    <line x1="1502"  y1="0" x2="1502"  y2="880"/>
  </g>
</svg>