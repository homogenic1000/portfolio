name: Minify & deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Minify CSS and JS
        run: |
          npx -y esbuild@0.25.11 --minify --allow-overwrite --outdir=script script/*.js
          npx -y esbuild@0.25.11 --minify --allow-overwrite --outdir=. *.css

      - name: Remove non-site files
        run: |
          rm -rf node_modules .git .github .DS_Store \
                 package.json package-lock.json jsconfig.json opencode.json README.md .gitignore

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
