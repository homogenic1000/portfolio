<!DOCTYPE html>
<html lang="fr">

<head>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap');
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mathéo Delessert</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/media.css"/>
  <link rel="stylesheet" href="css/korg.css"/>
  <link rel="icon" type="image/x-icon" href="/favico.png"/>
  <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
  <script src="script/handlers.js"></script>
  <script src="script/boundaries.js"></script>
  <script src="script/objects.js"></script>
  <script src="script/projects.js"></script>
  <script src="script/physics.js"></script>
  <script src="script/animation.js"></script>
  <script src="script/cdnLOAD.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>

<body>

  <div id="no-mobile">
          <img style="margin-top: 12em ;" width="450" src="assets/2d/mobile.webp" alt="">
    <h3>
      an responsive version of the portfolio will be devlopped in the future, for now im focussing at building the basics <br />
    </h3>

  </div>

  <div id="media-query">
    <!-- SVG Filter -->
    <svg width="0" height="0">
      <filter id="displacementFilterLow">
          <feTurbulence id="turbulence" type="turbulence" baseFrequency="0.9" numOctaves="10" result="turbulence" />
          <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="displacementFilter">
        <feTurbulence id="turbulence" type="turbulence" baseFrequency="0.9" numOctaves="10" result="turbulence" />
        <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="7" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="liquidFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="8" result="blurredNoise" />
        <feDisplacementMap in2="blurredNoise" in="SourceGraphic" scale="25" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="liquidFilterLow">
        <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="8" result="blurredNoise" />
        <feDisplacementMap in2="blurredNoise" in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <!-- Contenu -->
    <div id="hero-section">
      <div id="physic">
        <img id="animation-bag" src="assets/animation/frame1.webp" alt="Animation" />
        <img id="sandwich" src="assets/animation/frame-sandwich.webp" alt="" />
      </div>
      <section>
        <h1 id="title-d">
          Hello, my name is Mathéo Delessert <br />Welcome to my portfolio, all
          my work is in my bag!
        </h1>
      </section>
    </div>
    
    <main id="layout">
      <section class="column">
          <section class="box" id="content">
          <h1><u><a href="https://matheodelessert.ch/"><span id="index"><u>index</u></span></a>/<span id="project-title"></span></u></h1>
              <p id="project-text"></p>
          </section>
          <section class="box" id="show-min"></section>
      </section>
      <section class="box" id="show">
        <div id="container-cd"></div>
        <video id="project-video" controls playsinline loop muted></video>
      </section>
    </main>

  </div>
        <script src="script/korg-script/projects-controller.js"></script>
        <script type="module" src="script/korg-script/main.js"></script>
    </body>
</html>
